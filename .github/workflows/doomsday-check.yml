name: Doomsday ticket watch

on:
  schedule:
    # Every 5 minutes - the shortest interval GitHub accepts. Scheduled runs are
    # queued, so expect a few minutes of drift under load; this is a fast watch,
    # not a to-the-second alarm.
    - cron: "*/5 * * * *"
  workflow_dispatch: # run it by hand from the Actions tab

concurrency:
  group: doomsday-check
  cancel-in-progress: false

permissions:
  contents: write # so the job can commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every chain
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.main

      - name: Persist state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "doomsday-bot"
            git config user.email "doomsday-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another run may have landed while this one was working.
            git pull --rebase --autostash || true
            git push
          fi
