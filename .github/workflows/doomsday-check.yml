name: Doomsday ticket watch

on:
  schedule:
    # Asks for every 5 minutes. In practice GitHub treats scheduled workflows as
    # low priority and has been running this roughly every 3-4 hours. It's the
    # backup and the daily report; the per-minute IMAX watch runs elsewhere
    # (see watch_imax.ps1).
    - cron: "*/5 * * * *"
  workflow_dispatch: # run it by hand from the Actions tab
    inputs:
      force_heartbeat:
        description: "Send the status report even if nothing changed (verifies delivery)"
        type: boolean
        default: false
      imax_watch_minutes:
        description: "After the check, keep watching IMAX every minute for this many minutes (0-25)"
        type: string
        default: "0"

concurrency:
  group: doomsday-check
  cancel-in-progress: false

permissions:
  contents: write # so the job can commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every chain (IMAX first)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_MINUTES: ${{ inputs.imax_watch_minutes || '0' }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set - alerts would go nowhere."
            exit 1
          fi
          mins="$WATCH_MINUTES"
          case "$mins" in ''|*[!0-9]*) mins=0 ;; esac
          if (( mins > 25 )); then mins=25; fi
          python -m bot.main ${{ inputs.force_heartbeat && '--force-heartbeat' || '' }} --imax-watch $(( mins * 60 ))

      - name: Persist state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "doomsday-bot"
            git config user.email "doomsday-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            # If someone pushed meanwhile, keep this run's state (it's newest).
            # In a rebase, "theirs" is the commit being replayed - ours.
            git pull --rebase -X theirs || git rebase --abort
            git push
          fi
